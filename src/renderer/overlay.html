<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Cronômetro</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="w" class="w ok">
    <div class="top">
      <span class="lbl"><span id="lbl">TEMPO RESTANTE</span> <span id="badge" class="badge"></span></span>
      <span class="btns">
        <button id="bToggle" data-cmd="toggle" title="Iniciar / pausar">▶</button>
        <button data-cmd="adjust" data-delta="-1" title="-1 minuto">−1</button>
        <button data-cmd="adjust" data-delta="1" title="+1 minuto">+1</button>
        <button data-cmd="reset" title="Reiniciar">↺</button>
        <button data-cmd="panel:show" title="Abrir o painel">☰</button>
        <button data-cmd="overlay:hide" title="Ocultar (reabra pelo painel ou Ctrl+Alt+O)">✕</button>
      </span>
    </div>
    <div id="big" class="big">20:00</div>
    <div class="bottom"><span id="fim"></span><span id="hora"></span></div>
  </div>
  <script src="../shared/cron.js"></script>
  <script src="common.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
