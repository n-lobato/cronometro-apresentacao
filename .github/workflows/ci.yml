name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes unitários
        run: npm test

      - name: Teste da versão para navegador (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron test/web-limits.js --no-sandbox

      - name: Teste da versão para navegador (Windows/macOS)
        if: runner.os != 'Linux'
        run: npx electron test/web-limits.js

      - name: Teste de fumaça no Linux (abre o app numa tela virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox
        env:
          SMOKE_OUT: smoke-output

      - name: Teste de fumaça no Windows/macOS (abre o app de verdade)
        if: runner.os != 'Linux'
        run: npx electron . --smoke-test
        env:
          SMOKE_OUT: smoke-output

      - name: Guardar capturas de tela
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-output
          if-no-files-found: ignore
