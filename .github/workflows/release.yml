name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar instaladores (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes unitários
        run: npm test

      - name: Empacotar
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar instaladores
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/Cronometro-de-Apresentacao-*.exe
            dist/Cronometro-de-Apresentacao-*.dmg
            dist/Cronometro-de-Apresentacao-*.AppImage
            dist/Cronometro-de-Apresentacao-*.deb

  release:
    name: Publicar release
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Conferir arquivos
        run: ls -la out

      - name: Criar ou completar a release no GitHub
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            BODY=$(gh release view "$TAG" --json body --jq .body)
            if [ -z "$BODY" ]; then gh release edit "$TAG" --notes-file .github/release-notes.md; fi
          else
            gh release create "$TAG" out/* \
              --title "Cronômetro de Apresentação $TAG" \
              --notes-file .github/release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
