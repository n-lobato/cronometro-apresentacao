name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar instaladores (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes unitários
        run: npm test

      - name: Empacotar
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/Cronometro-de-Apresentacao-*.exe
            dist/Cronometro-de-Apresentacao-*.dmg
            dist/Cronometro-de-Apresentacao-*.AppImage
            dist/Cronometro-de-Apresentacao-*.deb

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Conferir arquivos
        run: ls -la out

      - name: Criar release no GitHub
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Cronômetro de Apresentação $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
